 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body { margin: 0; overflow: hidden; background: transparent; }

    #canvas { position: absolute; top: 0; left: 0; }
    #fx { position: absolute; width: 1080px; height: 1920px; pointer-events: none; }

    .big-profile {
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 40px;
        object-fit: cover;
        border: 18px solid transparent;
        animation: bigProfile 5s ease-out forwards;
    }

    @keyframes bigProfile {
        0% { transform: scale(0.1); opacity: 0; }
        20% { transform: scale(1.25); opacity: 1; }
        40% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0; }
    }

    .big-name-inside {
        position: absolute;
        bottom: 20px;
        left: 0;
        width: 100%;
        text-align: center;
        font-weight: 900;
        color: white;
        text-shadow: 0 0 15px black;
        pointer-events: none;
        font-size: 60px;
        padding: 0 20px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
        transform-origin: center;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="fx"></div>

<audio id="joinSound" src="join.mp3"></audio>
<audio id="giftSound" src="gift.mp3"></audio>

<script>
/* CANVAS FIX — EXACT CA ÎNAINTE */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = 1080;
canvas.height = 1920;

/* LISTE */
let objects = [];
let floatingUsers = new Set();
let activeUsers = new Map();   // uid → timestamp ultima activitate
let profileCache = {};

const ACTIVE_TIMEOUT = 60000; // 🔥 60 secunde fără activitate = dispare

function markActivity(uid) {
    activeUsers.set(uid, Date.now());
}

function cleanupInactive() {
    const now = Date.now();
    for (const [uid, last] of activeUsers.entries()) {
        if (now - last > ACTIVE_TIMEOUT) {
            activeUsers.delete(uid);
            floatingUsers.delete(uid);
            objects = objects.filter(o => o.uid !== uid);
        }
    }
}
setInterval(cleanupInactive, 2000);

/* ÎNCĂRCARE POZE */
function loadProfile(url, callback) {
    if (!url) return;
    if (profileCache[url]) return callback(profileCache[url]);

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
        profileCache[url] = img;
        callback(img);
    };
    img.src = url;
}

/* SPAWN AVATAR */
function spawnFloatingAvatar(url, uid) {
    if (!url || !uid) return;

    markActivity(uid);

    if (floatingUsers.has(uid)) return;

    floatingUsers.add(uid);

    loadProfile(url, (img) => {
        const neonColor = `hsl(${Math.random()*360}, 100%, 50%)`;

        objects.push({
            uid: uid,
            img: img,
            neon: neonColor,
            x: Math.random() * 1080,
            y: Math.random() * 1920,
            vx: (Math.random() * 2 - 1),
            vy: (Math.random() * 2 - 1),
            size: 120
        });
    });
}

/* DESEN AVATAR ROTUND */
function drawCircleImage(ctx, img, x, y, size, neonColor) {
    ctx.save();

    ctx.beginPath();
    ctx.arc(x, y, size/2 + 5, 0, Math.PI * 2);
    ctx.strokeStyle = neonColor;
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y, size/2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, x - size/2, y - size/2, size, size);

    ctx.restore();
}

/* RESPINGERE */
function repelAvatars() {
    for (let i = 0; i < objects.length; i++) {
        for (let j = i + 1; j < objects.length; j++) {
            const a = objects[i];
            const b = objects[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < 140) {
                const angle = Math.atan2(dy, dx);
                const force = 2.2;

                a.vx -= Math.cos(angle) * force;
                a.vy -= Math.sin(angle) * force;

                b.vx += Math.cos(angle) * force;
                b.vy += Math.sin(angle) * force;
            }
        }
    }
}

/* MARGINI */
function fixEdges(o) {
    const r = o.size / 2;

    if (o.x < r) { o.x = r; o.vx *= -1; }
    if (o.x > 1080 - r) { o.x = 1080 - r; o.vx *= -1; }
    if (o.y < r) { o.y = r; o.vy *= -1; }
    if (o.y > 1920 - r) { o.y = 1920 - r; o.vy *= -1; }
}

/* LOOP FPS 30 */
let lastFrame = 0;
const fpsInterval = 1000 / 30;

function loop(ts) {
    if (ts - lastFrame < fpsInterval) {
        requestAnimationFrame(loop);
        return;
    }
    lastFrame = ts;

    ctx.clearRect(0, 0, 1080, 1920);

    repelAvatars();

    for (const o of objects) {
        o.x += o.vx;
        o.y += o.vy;
        fixEdges(o);

        ctx.save();
        ctx.translate(o.x, o.y);
        drawCircleImage(ctx, o.img, 0, 0, o.size, o.neon);
        ctx.restore();
    }

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* POZA PROFIL */
function getProfileUrl(data) {
    return data.profilePictureUrl ||
           data.userDetails?.profilePictureUrls?.[0] ||
           null;
}

/* ZOOM MARE — CENTRAT PERFECT */
function spawnBigProfile(url, username) {
    if (!url) return;

    const fx = document.getElementById("fx");

    const wrapper = document.createElement("div");
    wrapper.style.position = "absolute";
    wrapper.style.left = (1080/2 - 350) + "px";
    wrapper.style.top = (1920/2 - 350) + "px";
    wrapper.style.width = "700px";
    wrapper.style.height = "700px";
    wrapper.style.pointerEvents = "none";
    wrapper.style.animation = "bigProfile 5s ease-out forwards";

    const img = document.createElement("img");
    img.src = url;
    img.className = "big-profile";
    img.style.borderColor = `hsl(${Math.random()*360}, 100%, 50%)`;

    const name = document.createElement("div");
    name.className = "big-name-inside";
    name.innerText = username;

    wrapper.appendChild(img);
    wrapper.appendChild(name);
    fx.appendChild(wrapper);

    setTimeout(() => {
        const maxWidth = 660;
        let fontSize = 60;

        while (name.scrollWidth > maxWidth && fontSize > 20) {
            fontSize -= 2;
            name.style.fontSize = fontSize + "px";
        }
    }, 10);

    setTimeout(() => wrapper.remove(), 5000);
}

/* WEBSOCKET */
const ws = new WebSocket("ws://localhost:62024");

ws.onmessage = (event) => {
    let packet;
    try { packet = JSON.parse(event.data); } catch(e) { return; }

    const data = packet.data || {};
    const uid = data.secUid || data.userId || data.uniqueId;
    const profileUrl = getProfileUrl(data);
    const username = data.nickname || data.uniqueId || "User";

    if (!uid) return;

    /* JOIN */
    if (packet.event === "member") {
        markActivity(uid);
        document.getElementById("joinSound").play();
        spawnBigProfile(profileUrl, username);
        spawnFloatingAvatar(profileUrl, uid);
        return;
    }

    /* GIFT */
    if (packet.event === "gift") {
        markActivity(uid);
        document.getElementById("giftSound").play();
        spawnBigProfile(profileUrl, username);
        spawnFloatingAvatar(profileUrl, uid);
        return;
    }

    /* CHAT */
    if (packet.event === "chat") {
        markActivity(uid);
        spawnFloatingAvatar(profileUrl, uid);
        return;
    }

    /* LIKE */
    if (packet.event === "like") {
        markActivity(uid);
        spawnFloatingAvatar(profileUrl, uid);
        return;
    }
};
</script>

</body>
</html>
